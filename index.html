<style>
:root{
  --text:#2C2C2B; --muted:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface2:#F0EFED; --border:#E6E5E3;
  --blue:#2783DE; --blue-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458; --red-soft:#FCE9E7;
  --purple:#8A5CC4; --purple-soft:#F1EAFB;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{max-width:100%; overflow-x:hidden}
/* ponsel: cegah teks membesar sendiri saat layar diputar & sorotan biru saat disentuh */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(15,122,90,.12)}
button,a,input,select,textarea{-webkit-tap-highlight-color:rgba(15,122,90,.12)}
/* target sentuh minimal 44px di perangkat sentuh */
@media (hover:none){
  .btn,.iconbtn,.chip,.thumb .fav,.bottomnav button{min-height:44px}
  .btn.sm{min-height:40px}
}
/* isian form: 16px supaya iOS Safari tidak melakukan zoom paksa saat difokus */
@media (max-width:820px){
  .field input,.field select,.field textarea,.composer input,.searchbar input{font-size:16px}
}
/* baris isian: dua atau tiga kolom di layar lebar, satu kolom di ponsel */
.frow{display:grid; gap:16px; min-width:0}
.frow.two{grid-template-columns:1fr 1fr}
.frow.three{grid-template-columns:1fr 1fr 1fr}
.frow>*{min-width:0}
.field input,.field select,.field textarea{max-width:100%}
@media (max-width:720px){
  .frow.two,.frow.three{grid-template-columns:1fr}
}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.wrap{max-width:1120px; margin:0 auto; padding:0 32px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- APP BAR ---------- */
.appbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.appbar .row{display:flex; align-items:center; gap:16px; height:64px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:0 0 auto}
.brand .mark{width:40px; height:40px; border-radius:9px; background:var(--blue); display:grid; place-items:center; overflow:hidden; flex:0 0 auto}
.brand .mark img{width:31px; height:31px; object-fit:contain}
.brand b{font-size:17px; letter-spacing:.02em}
.brand small{display:block; font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; line-height:1}
.tabs{display:flex; gap:2px; margin-left:8px; overflow-x:auto; flex:1 1 auto; min-width:0; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:none; border:0; padding:10px 12px; border-radius:8px; color:var(--muted);
  font-size:14.5px; white-space:nowrap; position:relative;
}
.tabs button:hover{background:var(--soft); color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--blue-soft); color:#1d5f9f; font-weight:600}
.tabs .badge{
  display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:999px;
  background:var(--red); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center;
}
.spacer{flex:1}
.btn{
  white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
  padding:0 18px; border-radius:8px; border:1px solid var(--border); background:var(--canvas);
  color:var(--text); font-size:14.5px; font-weight:500; text-decoration:none; transition:.15s;
}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:#1f74c8}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:#a8423a; border-color:#f0cfcb; background:var(--red-soft)}
.btn.ok{color:#2f7550; border-color:#c9e2d3; background:var(--green-soft)}
.btn.sm{min-height:36px; padding:0 12px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.me{display:flex; align-items:center; gap:10px; padding-left:12px; border-left:1px solid var(--border)}
.avatar{
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  background:var(--blue-soft); color:#1d5f9f; font-weight:700; font-size:13.5px; flex:0 0 auto;
}
.avatar.lg{width:52px; height:52px; font-size:17px}
.me .who{font-size:13.5px; line-height:1.25}
.me .who span{display:block; color:var(--muted); font-size:12.5px}

/* ---------- HERO ---------- */
.hero{background:var(--soft); border-bottom:1px solid var(--border); padding:36px 0 28px}
.hero .inner{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center}
/* logo lockup 1:1 */
.lockup{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.logo-sq{
  width:104px; aspect-ratio:1/1; border-radius:20px; background:var(--canvas);
  border:1px solid var(--border); display:grid; place-items:center; overflow:hidden;
  box-shadow:var(--shadow); flex:0 0 auto;
}
.logo-sq img{width:84%; height:84%; object-fit:contain}
.logo-sq.sm{width:52px; border-radius:12px}
.emblem{width:88px; height:88px; border-radius:50%; flex:0 0 auto; background:var(--canvas)}
.emblem.sm{width:34px; height:34px}
.emblem.xs{width:20px; height:20px; vertical-align:-4px; margin-right:4px}
.lockup .t{font-size:13.5px; color:var(--muted); line-height:1.35}
.lockup .t b{display:block; color:var(--text); font-size:18px; letter-spacing:.02em}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--blue); background:var(--blue-soft);
  border-radius:999px; padding:6px 12px; margin-bottom:16px;
}
h1{font-size:38px; line-height:1.08; letter-spacing:-.02em; margin:0 0 10px}
.hero p{margin:0; color:var(--muted); font-size:16.5px; max-width:52ch}
.searchbar{
  display:flex; align-items:center; gap:10px; margin-top:20px; background:var(--canvas);
  border:1px solid var(--border); border-radius:10px; padding:6px 6px 6px 14px; box-shadow:var(--shadow);
}
.searchbar{flex-wrap:wrap}
.searchbar input{flex:1 1 140px; min-width:0; border:0; outline:0; background:none; min-height:38px; font-size:15px}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.stat{background:var(--canvas); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:13.5px; color:var(--muted)}
.stat b{color:var(--text)}
.hero-art{position:relative; height:220px}
.hero-art .tile{
  position:absolute; border-radius:14px; border:1px solid var(--border); overflow:hidden; line-height:0;
  background:var(--canvas); box-shadow:var(--shadow); aspect-ratio:4/3;
}
.hero-art .t1{width:56%; left:0; top:8px; transform:rotate(-3deg)}
.hero-art .t2{width:52%; right:2%; top:0; transform:rotate(4deg)}
.hero-art .t3{width:46%; left:24%; bottom:0; transform:rotate(-1deg)}
.hero-art .swap{
  position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff;
  display:grid; place-items:center; box-shadow:0 6px 18px rgba(39,131,222,.35); z-index:2;
}

/* ---------- LAYOUT ---------- */
main{padding:28px 0 64px}
.section-head{display:flex; align-items:flex-end; gap:16px; margin:0 0 16px}
.section-head h2{margin:0; font-size:22px; letter-spacing:-.01em}
.section-head p{margin:2px 0 0; color:var(--muted); font-size:14.5px}
.section-head .spacer{flex:1}
h3.k{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 10px}

.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px}
.chip{
  border:1px solid var(--border); background:var(--canvas); border-radius:999px;
  padding:8px 14px; font-size:13.5px; color:var(--muted); white-space:nowrap; min-height:38px;
}
.chip:hover{background:var(--soft); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:#fff; font-weight:500}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12.5px; color:var(--muted); font-weight:500}
.field select,.field input,.field textarea{
  border:1px solid var(--border); border-radius:8px; background:var(--canvas);
  padding:10px 12px; min-height:44px; outline:0;
}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
.field textarea{min-height:92px; resize:vertical}
.hint{font-size:12.5px; color:var(--muted)}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.grid.two{grid-template-columns:repeat(2,1fr)}

/* ---------- CARD ---------- */
.card{
  background:var(--canvas); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; transition:.18s;
}
.card.pad{padding:20px}
.card.hoverable:hover{box-shadow:var(--shadow); transform:translateY(-2px); border-color:#dcdbd8}
.thumb{position:relative; aspect-ratio:4/3; background:var(--surface2); overflow:hidden; line-height:0}
.thumb svg,.thumb img{width:100%; height:100%; object-fit:cover}
.thumb .tags{position:absolute; left:10px; top:10px; display:flex; gap:6px; flex-wrap:wrap}
.thumb .fav{
  position:absolute; right:10px; top:10px; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:rgba(255,255,255,.92); display:grid; place-items:center;
}
.tag{
  font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  background:rgba(255,255,255,.94); border:1px solid var(--border); color:var(--muted);
  border-radius:6px; padding:4px 8px;
}
.tag.b{background:var(--blue-soft); border-color:#cfe6f9; color:#1d5f9f}
.tag.g{background:var(--green-soft); border-color:#c9e2d3; color:#2f7550}
.tag.o{background:var(--orange-soft); border-color:#f2ddc7; color:#9c5a24}
.tag.p{background:var(--purple-soft); border-color:#e2d4f6; color:#6b45a0}
.card .body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
.card h4{margin:0; font-size:16.5px; line-height:1.3}
.meta{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); flex-wrap:wrap}
.value{font-size:18px; font-weight:600; letter-spacing:-.01em}
.wants{font-size:13.5px; color:var(--muted); background:var(--soft); border-radius:8px; padding:8px 10px}
.wants b{color:var(--text); font-weight:600}
.card .foot{display:flex; gap:8px; margin-top:auto}
.card .foot .btn{flex:1}
.match{display:flex; align-items:center; gap:8px; font-size:13px; color:#2f7550; background:var(--green-soft); border-radius:8px; padding:8px 10px}

.pill{text-transform:capitalize; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:500; background:var(--surface2); display:inline-block}
.pill.b{background:var(--blue-soft); color:#1d5f9f}
.pill.g{background:var(--green-soft); color:#2f7550}
.pill.o{background:var(--orange-soft); color:#9c5a24}
.pill.r{background:var(--red-soft); color:#a8423a}
.pill.p{background:var(--purple-soft); color:#6b45a0}

.empty{
  border:1px dashed var(--border); border-radius:var(--radius); padding:40px 24px;
  text-align:center; color:var(--muted); background:var(--soft);
}
.empty b{display:block; color:var(--text); margin-bottom:4px; font-size:16px}

/* ---------- MODAL ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(28,28,27,.45); z-index:60;
  display:flex; align-items:flex-start; justify-content:center; padding:32px 16px;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
.scrim[hidden]{display:none}
.sheet{
  background:var(--canvas); border-radius:16px; width:100%; max-width:900px;
  box-shadow:0 24px 60px rgba(0,0,0,.22); overflow:hidden; overscroll-behavior:contain;
}
.sheet .head{
  display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--canvas); z-index:2;
}
.sheet .head h3{margin:0; font-size:17px; flex:1}
.sheet .content{padding:24px}
.iconbtn{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--border);
  background:var(--canvas); display:grid; place-items:center;
}
.iconbtn:hover{background:var(--soft)}
.detail{display:grid; grid-template-columns:1.05fr .95fr; gap:28px}
.detail .gal{border:1px solid var(--border); border-radius:12px; overflow:hidden; aspect-ratio:4/3; background:var(--surface2)}
.detail .gal svg,.detail .gal img{width:100%;height:100%;object-fit:cover}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14.5px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.owner{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--soft)}
.owner .n{flex:1; font-size:14.5px}
.owner .n span{display:block; color:var(--muted); font-size:13px}
.pickrow{
  display:flex; align-items:center; gap:12px; border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--canvas);
}
.pickrow:hover{background:var(--soft)}
.pickrow input{width:20px; height:20px; accent-color:var(--blue)}
.pickrow .t{flex:1; font-size:14.5px}
.pickrow .t span{display:block; color:var(--muted); font-size:13px}
.calc{background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:16px; display:grid; gap:8px; font-size:14.5px}
.calc .line{display:flex; justify-content:space-between; gap:12px}
.calc .line.total{border-top:1px solid var(--border); padding-top:8px; font-weight:600}

/* ---------- CHAT ---------- */
.thread{display:grid; grid-template-columns:1fr; gap:12px; max-height:320px; overflow-y:auto; padding:4px 2px}
.msg{max-width:78%; padding:10px 14px; border-radius:14px; font-size:14.5px; background:var(--surface2)}
.msg .who{display:block; font-size:11.5px; color:var(--muted); margin-bottom:2px}
.msg.mine{margin-left:auto; background:var(--blue-soft); color:#17548c}
.msg.sys{margin:0 auto; background:var(--soft); border:1px dashed var(--border); color:var(--muted); font-size:13px; text-align:center}
.composer{display:flex; gap:8px; margin-top:12px}
.composer input{flex:1; border:1px solid var(--border); border-radius:8px; padding:0 12px; min-height:44px; outline:0}
.composer input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
.steps{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.steps .s{padding:5px 10px; border-radius:999px; background:var(--surface2)}
.steps .s.on{background:var(--blue); color:#fff; font-weight:600}
.steps .s.done{background:var(--green-soft); color:#2f7550}

/* ---------- PHOTOS PICKER ---------- */
.photos{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.photo{
  aspect-ratio:1; border:1px dashed var(--border); border-radius:10px; background:var(--soft);
  display:grid; place-items:center; position:relative; overflow:hidden; color:var(--muted); font-size:13px; text-align:center;
}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.photo .x{position:absolute; right:6px; top:6px; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,.94)}

/* ---------- TOAST ---------- */
.toasts{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80; display:grid; gap:8px; width:min(92vw,420px)}
.toast{
  background:var(--text); color:#fff; border-radius:10px; padding:12px 16px; font-size:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.2); display:flex; gap:10px; align-items:center;
}
.toast.ok{background:#2f7550}
.toast.warn{background:#9c5a24}

footer{border-top:1px solid var(--border); padding:24px 0 40px; color:var(--muted); font-size:13.5px}
footer .row{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero .inner{grid-template-columns:1fr}
  .hero-art{display:none}
  .detail{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{overflow-x:hidden}
  .wrap{padding:0 20px}
  h1{font-size:26px}
  .hero{padding:24px 0 22px}
  .appbar .row > .btn.primary{display:none}
  .searchbar{padding:10px}
  .lockup{gap:10px; margin-bottom:14px}
  .logo-sq{width:76px; border-radius:16px}
  .emblem{width:62px; height:62px}
  .lockup .t{font-size:12.5px}
  footer .row{flex-direction:column; align-items:flex-start !important; gap:14px}
  footer .row span{text-align:left !important}
  .searchbar .btn{width:100%}
  .toolbar .field{flex:1 1 44%}
  .sheet{border-radius:12px}
  .scrim{padding:12px 8px}
  .grid,.grid.two{grid-template-columns:1fr}
  .appbar .row{height:auto; padding:10px 0; flex-wrap:wrap}
  .me .who{display:none}
  .tabs{order:3; width:100%; margin-left:0}
  .sheet .content{padding:18px}
}
/* ================= TEMA ALAM: hutan, senja, sabana ================= */
:root{
  --pine:#0F7A5A; --pine-dark:#0C6248; --leaf:#48A86B; --lime:#8DC63F;
  --sunset:#D9822B; --clay:#C4643F; --sky:#2C9CDB; --plum:#7C5CD6;
  --mint:#DFF4EC; --sand:#FBF1DF;
}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(900px 430px at 6% -10%, #E7F6EE 0%, rgba(231,246,238,0) 70%),
    radial-gradient(820px 400px at 102% -4%, #FDEFDB 0%, rgba(253,239,219,0) 66%),
    var(--canvas);
}
.appbar{
  background:linear-gradient(90deg, rgba(255,255,255,.94), rgba(223,244,236,.94));
  border-bottom:1px solid #D8E7DD;
}
.brand .mark{
  background:linear-gradient(135deg,#0F7A5A 0%,#3E9B62 55%,#8DC63F 100%);
  box-shadow:0 4px 14px rgba(15,122,90,.3);
}
.brand b{font-weight:800}
.brand small{color:#3E7C63}
.tabs button{font-weight:600}
.tabs button:hover{background:#EAF5EE; color:var(--pine-dark)}
.tabs button[aria-selected="true"]{
  background:linear-gradient(135deg,var(--pine),var(--leaf)); color:#fff;
  box-shadow:0 4px 14px rgba(15,122,90,.28);
}
.tabs .badge{background:linear-gradient(135deg,#E0553F,#E8863C)}
.btn{font-weight:600}
.btn.primary{
  background:linear-gradient(135deg,var(--pine),var(--leaf)); border-color:transparent;
  box-shadow:0 8px 20px rgba(15,122,90,.28);
}
.btn.primary:hover{background:linear-gradient(135deg,var(--pine-dark),#3E9B62)}
.btn.ok{background:var(--mint); border-color:#BFE3D3; color:var(--pine-dark)}
.avatar{background:linear-gradient(135deg,var(--pine),var(--lime)); color:#fff}
.me{border-left:1px solid #D8E7DD}

.hero{
  position:relative; overflow:hidden; border-bottom:1px solid #E2E9DE;
  background:linear-gradient(155deg,#E9F6EE 0%,#F7F3E5 52%,#FDEADB 100%);
}
.hero::before{
  content:""; position:absolute; inset:-30% -10% auto auto; width:70%; height:190%;
  background:repeating-radial-gradient(circle at 70% 30%, rgba(15,122,90,.09) 0 1.5px, rgba(15,122,90,0) 1.5px 30px);
  pointer-events:none;
}
.hero .inner{position:relative; z-index:1}
.eyebrow{background:linear-gradient(135deg,var(--mint),var(--sand)); color:var(--pine-dark)}
h1{
  font-weight:800;
  background:linear-gradient(115deg,#0C5741 0%,#2F8F5F 45%,#C47130 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.searchbar{border-color:#DCE7DC; box-shadow:0 8px 22px rgba(15,122,90,.09)}
.stats .stat:nth-of-type(1){background:var(--mint); border-color:#C6E6D7}
.stats .stat:nth-of-type(2){background:var(--sand); border-color:#EFDFC2}
.stats .stat:nth-of-type(3){background:#E7F0FC; border-color:#CFE2F7}
.stats .stat:nth-of-type(4){background:#F2EAFC; border-color:#E0D2F5}
.hero-art .swap{
  background:linear-gradient(135deg,var(--pine),var(--lime));
  box-shadow:0 8px 22px rgba(15,122,90,.38);
}

.section-head h2{position:relative; padding-left:15px; font-weight:800}
.section-head h2::before{
  content:""; position:absolute; left:0; top:.16em; bottom:.16em; width:6px;
  border-radius:99px; background:linear-gradient(var(--pine),var(--lime));
}
.chip{font-weight:600}
.chip:hover{background:#EAF5EE; color:var(--pine-dark); border-color:#C6E6D7}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#12362A,#2F6B51); border-color:transparent}

.card{border-radius:18px; border-color:#E4EBE0}
.card.hoverable:hover{box-shadow:0 14px 34px rgba(15,122,90,.15); border-color:#BFE0CE}
.thumb{background:linear-gradient(140deg,#E3F1E8,#F8EFDE)}
.tag.b{background:var(--mint); border-color:#BFE3D3; color:var(--pine-dark)}
.tag.g{background:#E8F6DC; border-color:#D2E9B6; color:#4A7220}
.tag.o{background:#FCEBD8; border-color:#F2DBBE; color:#9C5A24}
.tag.p{background:#F1EAFB; border-color:#E0D2F5; color:#6B45A0}
.pill.b{background:var(--mint); color:var(--pine-dark)}
.pill.g{background:#E8F6DC; color:#4A7220}
.wants{background:linear-gradient(135deg,#F2F7F0,#FBF3E6)}
.match{background:linear-gradient(135deg,#E7F6EC,#F1F9DE); color:var(--pine-dark)}
.value{font-weight:700}
.empty{background:linear-gradient(135deg,#F4F8F2,#FBF4E9); border-color:#DDE7DA}

.field select:focus,.field input:focus,.field textarea:focus,.composer input:focus{
  border-color:var(--pine); box-shadow:0 0 0 3px var(--mint);
}
.pickrow input{accent-color:var(--pine)}
.sheet{border-radius:20px}
.sheet .head{background:linear-gradient(90deg,#FFFFFF,#EFF8F3)}
.owner{background:linear-gradient(135deg,#F2F7F0,#FBF3E6)}
.calc{background:linear-gradient(135deg,#F3F8F1,#FBF4E8)}
.msg.mine{background:linear-gradient(135deg,var(--mint),#EDF7DC); color:var(--pine-dark)}
.steps .s.on{background:linear-gradient(135deg,var(--pine),var(--leaf))}
.toast.ok{background:linear-gradient(135deg,var(--pine),var(--leaf))}
.toast.warn{background:linear-gradient(135deg,#C47130,#DFA13C)}
footer{border-top:1px solid #E2E9DE}

/* ====== deretan foto berjalan di bagian sambutan ====== */
.hero-art{
  position:relative; display:flex; flex-direction:column; justify-content:center;
  gap:14px; overflow:hidden; min-height:300px;
}
.hero-art .reel{
  overflow:hidden; width:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
}
.hero-art .reel-track{
  display:flex; gap:14px; width:max-content;
  animation:reelSlide 34s linear infinite;
}
.hero-art .reel.rev .reel-track{animation-duration:44s; animation-direction:reverse}
.hero-art .reel:hover .reel-track{animation-play-state:paused}
.hero-art .chip{
  /* foto mengambang langsung di latar — tanpa kotak putih/kartu */
  flex:0 0 auto; width:134px; height:134px; padding:8px;
  display:grid; place-items:center; border-radius:0;
  background:transparent; box-shadow:none;
  animation:chipBob 5.4s ease-in-out infinite;
}
.hero-art .chip:nth-child(2n){animation-delay:-1.3s;}
.hero-art .chip:nth-child(3n){animation-delay:-2.7s}
.hero-art .chip:nth-child(5n){animation-delay:-4.1s}
.hero-art .chip img{
  width:100%; height:100%; object-fit:contain; display:block;
  filter:drop-shadow(0 7px 12px rgba(18,58,44,.22));
}
/* foto yang latarnya tak bisa dipisah: tampil penuh sebagai kartu foto */
.hero-art .chip.solid{padding:0; background:none}
.hero-art .chip.solid img{object-fit:cover; border-radius:26px; filter:none}
.thumb img.cut[src*="carrier"]{object-fit:cover; padding:0}
@keyframes reelSlide{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}
@keyframes chipBob{
  0%,100%{transform:translateY(0) rotate(-1.4deg)}
  50%{transform:translateY(-9px) rotate(1.4deg)}
}
@media (max-width:640px){
  .hero-art{min-height:210px; gap:10px}
  .hero-art .chip{width:104px; height:104px; padding:11px; border-radius:20px}
}

/* foto kategori tanpa latar, menyatu dengan warna kartu */
.thumb img.cut{
  object-fit:contain; padding:9%;
  background:transparent;
  filter:drop-shadow(0 6px 12px rgba(18,58,44,.16));
  transition:transform .4s cubic-bezier(.2,.7,.3,1);
}
.thumb:has(img.cut){background:linear-gradient(150deg,#FFFFFF 0%,#E9F5EE 55%,#FBEFDA 100%)}
.card:hover .thumb img.cut{transform:scale(1.07) rotate(-1.2deg)}

@media (prefers-reduced-motion:reduce){
  .hero-art .reel-track,.hero-art .chip{animation:none !important}
  .thumb img.cut{transition:none; animation:none !important}
  .grid .card.hoverable{animation:none !important}
}

/* penanda foto contoh kategori, bukan foto barang aslinya */
.thumb{position:relative}
.catref{
  position:absolute; left:8px; bottom:8px; z-index:2;
  padding:3px 8px; border-radius:999px;
  background:rgba(12,98,72,.82); color:#fff;
  font-size:10.5px; font-weight:700; letter-spacing:.02em;
  backdrop-filter:blur(4px); pointer-events:none;
}

/* ---------- NAVIGASI: tab atas + bilah bawah di layar kecil ---------- */
.appbar .tabs button{display:inline-flex; align-items:center; gap:7px}
.appbar .tabs button svg{width:18px; height:18px; flex:0 0 auto}
.appbar .tabs.scrollable{
  -webkit-mask-image:linear-gradient(90deg,#000 84%,rgba(0,0,0,.2) 100%);
  mask-image:linear-gradient(90deg,#000 84%,rgba(0,0,0,.2) 100%);
}
.bottomnav{display:none}
@media (max-width:1200px){
  .appbar .tabs{display:none !important}
  .bottomnav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:50; gap:2px;
    background:rgba(255,255,255,.97); backdrop-filter:blur(12px);
    border-top:1px solid #D8E7DD; box-shadow:0 -8px 24px rgba(15,122,90,.12);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav button{
    flex:1 1 0; min-width:0; position:relative; border:0; background:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 2px; border-radius:14px; color:var(--muted); font-size:11px; font-weight:700;
    letter-spacing:.01em; transition:.15s;
  }
  .bottomnav button svg{width:23px; height:23px}
  .bottomnav button .tl{
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .bottomnav button[aria-selected="true"]{background:var(--mint); color:var(--pine-dark)}
  .bottomnav button[aria-selected="true"] svg{stroke-width:2.1}
  .bottomnav .badge{
    position:absolute; top:2px; left:50%; margin-left:6px; min-width:17px; padding:0 5px;
    border-radius:999px; background:linear-gradient(135deg,#E0553F,#E8863C); color:#fff;
    font-size:10.5px; font-weight:700; line-height:17px; text-align:center;
  }
  main{padding-bottom:96px}
  footer{padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px))}
  .scrim{padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
  .toasts{bottom:96px}
}

/* ---------- TAMPILAN BARANG DI PONSEL ---------- */
@media (max-width:640px){
  .grid{grid-template-columns:1fr; gap:12px}
  .grid .card.hoverable{
    display:grid; grid-template-columns:126px 1fr; align-items:stretch;
    border-radius:20px; overflow:hidden;
  }
  .grid .card.hoverable .thumb{aspect-ratio:1/1; height:100%; border-radius:0}
  .grid .card.hoverable .thumb .tags{left:6px; top:6px; gap:4px}
  .grid .card.hoverable .thumb .tags .tag{font-size:10.5px; padding:2px 7px}
  .grid .card.hoverable .thumb .tags .tag.o{display:none}
  .grid .card.hoverable .thumb .fav{width:30px; height:30px; font-size:15px; right:6px; top:6px}
  .grid .card.hoverable .thumb .catref{display:none}
  .grid .card.hoverable .thumb img.cut{padding:7%}
  .grid .card.hoverable .body{padding:12px 14px 12px 13px; gap:5px}
  .grid .card.hoverable h4{
    font-size:15.5px; line-height:1.28; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .grid .card.hoverable .meta{font-size:12px}
  .grid .card.hoverable .value{font-size:15.5px}
  .grid .card.hoverable .value span{display:none}
  .grid .card.hoverable .wants,.grid .card.hoverable .match{
    font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid .card.hoverable .foot{gap:6px; margin-top:8px}
  .grid .card.hoverable .foot .btn{min-height:38px; padding:0 8px; font-size:13px}
  .grid .card.hoverable .foot .btn:not(.primary){flex:0 0 78px}
  .grid .card.hoverable:active{transform:scale(.985); transition:transform .12s}
  /* label tab bawah cukup satu kata, tidak lagi terpotong */
  .bottomnav button{font-size:11.5px; padding:7px 1px}
  .bottomnav button .tl{text-overflow:clip; letter-spacing:-.01em}
}

/* ---------- ANIMASI KARTU BARANG ---------- */
.grid .card.hoverable{animation:cardIn .55s cubic-bezier(.2,.75,.3,1) both}
.grid .card.hoverable:nth-child(1){animation-delay:.02s}
.grid .card.hoverable:nth-child(2){animation-delay:.08s}
.grid .card.hoverable:nth-child(3){animation-delay:.14s}
.grid .card.hoverable:nth-child(4){animation-delay:.2s}
.grid .card.hoverable:nth-child(5){animation-delay:.26s}
.grid .card.hoverable:nth-child(6){animation-delay:.32s}
.grid .card.hoverable:nth-child(n+7){animation-delay:.38s}
@keyframes cardIn{
  from{opacity:0; transform:translateY(16px) scale(.97)}
  to{opacity:1; transform:none}
}
@keyframes thumbFloat{
  0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}
  50%{transform:translateY(-6px) rotate(1deg) scale(1.04)}
}
/* di perangkat sentuh tidak ada hover, jadi foto bergerak sendiri */
@media (hover:none){
  .thumb img.cut{animation:thumbFloat 6.5s ease-in-out infinite; will-change:transform}
  .grid .card:nth-child(2n) .thumb img.cut{animation-delay:-1.6s}
  .grid .card:nth-child(3n) .thumb img.cut{animation-delay:-3.2s}
  .grid .card:nth-child(4n) .thumb img.cut{animation-delay:-4.8s}
  /* hemat baterai: hanya kartu pertama yang bergerak, sisanya diam */
  .grid .card:nth-child(n+7) .thumb img.cut{animation:none; will-change:auto}
}
/* di layar sangat kecil, gerakan foto dimatikan supaya gulir tetap mulus */
@media (hover:none) and (max-width:420px){
  .thumb img.cut{animation:none; will-change:auto}
}

/* ---------- DERET FOTO JUGA TAMPIL DI PONSEL ---------- */
@media (max-width:900px){
  .hero .inner .hero-art{
    display:flex !important; height:auto; min-height:0; margin-top:10px; order:9;
  }
  .hero-art .swap{display:none}
}
@media (max-width:640px){
  .hero-art{gap:9px}
  .hero-art .chip{width:96px; height:96px; padding:9px; border-radius:18px}
  .hero-art .chip.solid img{border-radius:18px}
  .hero-art .reel{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
  }
  .hero-art .reel-track{animation-duration:26s}
  .hero-art .reel.rev .reel-track{animation-duration:34s}
}

/* logo menyatu dengan latar, tanpa kotak putih */
.logo-sq{background:transparent; border:0; box-shadow:none}
.logo-sq img{width:100%; height:100%}
.emblem{background:transparent}
.brand .mark{background:transparent; box-shadow:none; border-radius:0}
.brand .mark img{width:38px; height:38px}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important} html{scroll-behavior:auto}}

/* Data lama dari versi sebelumnya bisa kehilangan sebagian bagian.
   Normalisasi mencegah layar putih akibat properti yang hilang. */
function normalize(d){
  if(!d || typeof d !== "object") return seed();
  d.profiles = Array.isArray(d.profiles) ? d.profiles : [];
  d.listings = Array.isArray(d.listings) ? d.listings : [];
  d.offers = Array.isArray(d.offers) ? d.offers : [];
  d.transactions = Array.isArray(d.transactions) ? d.transactions : [];
  d.reports = Array.isArray(d.reports) ? d.reports : [];
  d.profiles.forEach(p=>{
    p.name = String(p.name || "Anggota BIVAK");
    p.city = p.city || "";
    p.reputation = Number(p.reputation) || 0;
    p.deals = Number(p.deals) || 0;
  });
  d.listings.forEach(l=>{
    l.photos = Array.isArray(l.photos) ? l.photos : [];
    l.wants = Array.isArray(l.wants) ? l.wants : [];
    l.appraisedValue = Number(l.appraisedValue) || 0;
    l.createdAt = Number(l.createdAt) || Date.now();
    l.status = l.status || "aktif";
  });
  d.offers.forEach(o=>{
    o.items = Array.isArray(o.items) ? o.items : [];
    o.messages = Array.isArray(o.messages) ? o.messages : [];
    o.cashAdjustment = Number(o.cashAdjustment) || 0;
    o.createdAt = Number(o.createdAt) || Date.now();
    o.status = o.status || "Diajukan";
  });
  return d;
}

/* Boleh menawar barang yang sama beberapa kali, asalkan barang yang ditawarkan berbeda. */
function itemSetKey(items){
  return (items||[]).map(i=>i.listingId).sort().join(",");
}
function offerKey(o){
  return [o.proposerId,o.targetListingId,itemSetKey(o.items)].join("|");
}
function uniqueOffers(rows){
  const seen = new Set();
  return rows.filter(o=>{
    /* Riwayat selesai/ditolak tetap utuh; hanya penawaran aktif ganda yang disaring. */
    if(!openStatuses.includes(o.status)) return true;
    const key = offerKey(o);
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
}
const incoming = () => uniqueOffers(db.offers.filter(o=>{const t=listing(o.targetListingId); return t && t.ownerId===ME}));

function offerValue(o){ return (o && o.items ? o.items : []).reduce((a,i)=>a+(Number(i.valueSnapshot)||0),0); }
function matchReason(l){
  const mine = myListings().filter(m=>m.status==="aktif");
  for(const w of (l.wants||[])){
    for(const m of mine){
      const catOk = w.category===m.category;
      const kwOk = w.keyword && m.title.toLowerCase().includes(String(w.keyword).toLowerCase().split(" ")[0]);
      const valOk = (!w.min || m.appraisedValue>=w.min*0.8) && (!w.max || m.appraisedValue<=w.max*1.25);
      if((catOk||kwOk) && valOk) return {listing:m, want:w};
    }
  }
  return null;
}

async function cloudPull(){
  if(!cloudOn()) return;
  try{
    const [pr, lr, or_] = await Promise.all([
      sb.from("barter_profiles_public").select("*"),
      sb.from("barter_listings").select("*").order("created_at", {ascending:false}),
      sb.from("barter_offers").select("*").order("created_at", {ascending:false})
    ]);
    if(pr.data) pr.data.forEach(r=>{
      let p = db.profiles.find(x=>x.id===r.id);
      if(!p){ p = {id:r.id}; db.profiles.push(p); }
      p.name = r.display_name || p.name || "Anggota BIVAK";
      p.city = r.city || p.city || "";
      p.reputation = Number(r.rating || p.reputation || 0);
      p.deals = Number(r.deals_count || p.deals || 0);
      p.verified = !!r.verified;
    });
    if(lr.data){
      const favs = new Set(db.listings.filter(l=>l.favorite).map(l=>l.id));
      /* Barang yang sudah tersimpan di server dibuang dari salinan lokal agar tidak tampil dua kali. */
      const cloudIds = new Set(lr.data.map(r=>r.id));
      db.listings = db.listings.filter(l=>!l.remote && !cloudIds.has(l.id)).concat(lr.data.map(r=>{
        const l = rowToListing(r); l.favorite = favs.has(l.id); return l;
      }));
      db.listings.sort((a,b)=>b.createdAt-a.createdAt);
    }
    if(or_.data){
      const ids = or_.data.map(r=>r.id);
      let msgs = [];
      if(ids.length){
        const mr = await sb.from("barter_messages").select("*").in("offer_id", ids).order("at", {ascending:true});
        msgs = mr.data || [];
      }
      const cloudOfferIds = new Set(or_.data.map(r=>r.id));
      db.offers = db.offers.filter(o=>!o.remote && !cloudOfferIds.has(o.id)).concat(or_.data.map(r=>({
        id:r.id, targetListingId:r.target_listing_id, proposerId:r.proposer_id,
        items:r.items||[], cashAdjustment:Number(r.cash_adjustment||0), note:r.note||"",
        status:r.status||"Diajukan", createdAt:new Date(r.created_at||Date.now()).getTime(), remote:true,
        messages:msgs.filter(m=>m.offer_id===r.id).map(m=>({id:m.id, from:m.from_id || m.from_label || "sys", body:m.body||"", at:new Date(m.at||Date.now()).getTime()}))
      })));
    }
    dropDemoData();
    save();
  }catch(err){}
  const me = meProfile();
  if(me && me.isModerator) await cloudPullReports();
  cloudRealtime();
}

/* ---- buang data contoh begitu aplikasi memakai server sungguhan ---- */
function dropDemoData(){
  if(!cloudOn()) return;
  const keepId = x => x && (x.remote || isUuid(x.id));
  db.listings = db.listings.filter(keepId);
  db.offers = db.offers.filter(keepId);
  db.profiles = db.profiles.filter(p => p.id === ME || isUuid(p.id));
  db.transactions = (db.transactions||[]).filter(t => isUuid(t.offerId));
  db.reports = (db.reports||[]).filter(r => isUuid(String(r.targetId)));
  const me = db.profiles.find(p => p.id === ME);
  if(me && me.demoCleared !== true){
    me.demoCleared = true;
    if(typeof me.rating !== "number"){ me.reputation = 0; me.deals = 0; me.verified = false; }
  }
}

/* ---- realtime: barang, penawaran, dan chat masuk tanpa refresh ---- */
let rtChannel = null, rtTimer = null;
function cloudRealtime(){
  if(!cloudOn() || rtChannel) return;
  try{
    rtChannel = sb.channel("bivak-live")
      .on("postgres_changes", {event:"*", schema:"public", table:"barter_listings"}, ()=>rtSync("barang"))
      .on("postgres_changes", {event:"*", schema:"public", table:"barter_offers"}, ()=>rtSync("penawaran"))
      .on("postgres_changes", {event:"*", schema:"public", table:"barter_messages"}, ()=>rtSync("pesan"))
      .subscribe();
  }catch(err){ rtChannel = null; }
}
function rtSync(kind){
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async ()=>{
    const before = db.offers.reduce((a,o)=>a+(o.messages||[]).length, 0);
    await cloudPull();
    const after = db.offers.reduce((a,o)=>a+(o.messages||[]).length, 0);
    if(state.openOffer && !document.getElementById("scrim").hidden) openOffer(state.openOffer);
    else render();
    renderTabs();
    if(kind==="pesan" && after > before) toast("Ada pesan baru");
    if(kind==="penawaran") toast("Daftar penawaran diperbarui");
  }, 600);
}

/* ---- sinkron profil dengan tabel barter_profiles di Supabase ---- */
const P2R = {fullName:"full_name", name:"display_name", phone:"phone", address:"address", city:"city", province:"province", postal:"postal_code", landmark:"landmark", email:"email"};

async function syncProfileFromServer(){
  if(!sb || !auth.user || !auth.user.id) return;
  const me = meProfile(); if(!me) return;
  try{
    const {data, error} = await sb.from("barter_profiles").select("*").eq("id", auth.user.id).maybeSingle();
    if(error || !data){ me.reputation = 0; me.deals = 0; me.verified = false; me.isModerator = false; if(auth.user.email) me.email = auth.user.email; save(); return; }
    Object.keys(P2R).forEach(k=>{ const v = data[P2R[k]]; if(v!==null && v!==undefined && v!=="") me[k] = v; });
    if(data.birth_date) me.birth = String(data.birth_date).slice(0,10);
    if(data.registered_at) me.registeredAt = new Date(data.registered_at).getTime();
    me.reputation = Number(data.rating || 0); me.rating = me.reputation;
    me.deals = Number(data.deals_count || 0);
    me.verified = !!data.verified;
    me.isModerator = !!data.is_moderator;
    if(auth.user.email) me.email = auth.user.email;
    if(me.city && !CITIES.includes(me.city)) CITIES.push(me.city);
    save();
  }catch(err){}
  await cloudPull();
}

async function saveProfileToServer(me){
  if(!sb || !auth.user || !auth.user.id) return false;
  const row = {id: auth.user.id};
  Object.keys(P2R).forEach(k=>{ row[P2R[k]] = me[k] || null; });
  row.birth_date = me.birth || null;
  row.registered_at = new Date(me.registeredAt || Date.now()).toISOString();
  row.updated_at = new Date().toISOString();
  try{
    const {error} = await sb.from("barter_profiles").upsert(row);
    if(error){ toast("Tersimpan di perangkat, gagal ke server: "+error.message, "warn"); return false; }
    return true;
  }catch(err){ toast("Tersimpan di perangkat, server tidak terjangkau", "warn"); return false; }
}

async function submitRegistration(e){

  if(!/^\d{5}$/.test(g("regPostal"))){ toast("Kode pos harus 5 angka","warn"); return; }

  const me = meProfile(); if(!me) return;
  const first = !me.registeredAt;
  Object.assign(me, {
    fullName: g("regFull"),
    name: g("regDisplay") || g("regFull"),
    email: g("regEmail"),
    phone, birth: g("regBirth"),
    address: g("regAddress"),
    city: g("regCity"),
    province: g("regProvince"),
    postal: g("regPostal"),
    landmark: g("regLandmark"),
    registeredAt: me.registeredAt || Date.now()
  });

              : (synced ? "Data pendaftaran diperbarui di server" : "Data pendaftaran diperbarui"), "ok");

}

let searchTimer = null;
function queueSearch(v){
  state.q = v;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    state.page = 1;
    const rows = filtered();
    const box = document.getElementById("results");
    const cnt = document.getElementById("count");
    if(box) box.innerHTML = cardsHTML(rows);
    if(cnt) cnt.textContent = rows.length;
  }, 180);

function filtered(){
  let rows = db.listings.filter(l=>l.ownerId!==ME && (l.status==="aktif"||l.status==="dicadangkan"));
  const q = state.q.trim().toLowerCase();
  if(q) rows = rows.filter(l=>(l.title+" "+l.category+" "+l.description+" "+l.city).toLowerCase().includes(q));
  if(state.cat!=="Semua") rows = rows.filter(l=>l.category===state.cat);
  if(state.cond!=="Semua") rows = rows.filter(l=>l.condition===state.cond);

  if(state.vmax) rows = rows.filter(l=>l.appraisedValue<=state.vmax);

    : state.sort==="mahal" ? b.appraisedValue-a.appraisedValue : b.createdAt-a.createdAt);
  return rows;
}

let draftPhotos = [];
function paintPhotos(){
  const box = document.getElementById("photos"); if(!box) return;
  const slots = [0,1,2].map(i=> draftPhotos[i]
    ? `<div class="photo"><img src="${draftPhotos[i]}" alt="Foto ${i+1}"><button type="button" class="x" aria-label="Hapus foto" onclick="draftPhotos.splice(${i},1);paintPhotos()">✕</button></div>`
    : `<div class="photo">Slot ${i+1}</div>`);
  box.innerHTML = slots.join("");
}
function addPhotos(files){
  [...files].slice(0, 3-draftPhotos.length).forEach(f=>{
    if(!f.type.startsWith("image/")){ toast("Hanya file gambar yang diizinkan","warn"); return; }
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        const s = Math.min(1, 900/Math.max(img.width,img.height));
        cv.width = img.width*s; cv.height = img.height*s;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        if(cloudOn() && cv.toBlob){
          toast("Mengunggah foto…");
          cv.toBlob(async blob=>{
            if(!blob){ draftPhotos.push(cv.toDataURL("image/webp",.72)); paintPhotos(); return; }
            const url = await uploadPhoto(blob);
            if(url){ draftPhotos.push(url); paintPhotos(); toast("Foto terunggah","ok"); }
          }, "image/webp", .72);
        } else {
          draftPhotos.push(cv.toDataURL("image/webp",.72)); paintPhotos();
        }
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
  if(files.length > 3-draftPhotos.length) toast("Maksimal 3 foto per listing","warn");
}

let publishing = false;
function submitListing(ev){
  ev.preventDefault();
  const g = id => document.getElementById(id).value;
  const today = db.listings.filter(l=>l.ownerId===ME && Date.now()-l.createdAt < 864e5).length;
  if(today >= 5){ toast("Batas 5 listing baru per hari tercapai","warn"); return; }
  const val = +g("v");
  if(!val || val < 10000){ toast("Nilai taksasi minimal Rp10.000","warn"); return; }
  const l = {
    id:nid("l"), ownerId:ME, title:g("t").trim(), category:g("c"), condition:g("k"),
    appraisedValue:val, city:g("kt"), description:g("d").trim(), status:"aktif",
    photos:draftPhotos.slice(0,3), favorite:false, createdAt:Date.now(),
    wants:[{category:g("wc"), keyword:g("wk").trim(), min:+g("wmin")||0, max:+g("wmax")||0}]
  };
  /* Cegah publikasi ganda akibat tombol tertekan dua kali. */
  const kembar = db.listings.find(x=>x.ownerId===ME && x.title===l.title && x.category===l.category
    && Number(x.appraisedValue)===Number(l.appraisedValue) && Date.now()-x.createdAt < 12e4);
  if(kembar){
    draftPhotos = [];
    toast("Barang ini baru saja kamu publikasikan","warn");
    go("profil"); return;
  }
  if(publishing) return;
  publishing = true;
  const tombol = ev.target && ev.target.querySelector ? ev.target.querySelector('button[type="submit"]') : null;
  if(tombol) tombol.disabled = true;
  db.listings.unshift(l); save(); draftPhotos = [];
  cloudSaveListing(l);
  toast("Listing dipublikasikan · status Aktif","ok");
  go("profil");
  setTimeout(()=>{ publishing = false; }, 1500);
}

function saveListingEdit(event,id){
  event.preventDefault();
  const l = listing(id);
  if(!l || l.ownerId!==ME) return;
  const g = x => document.getElementById(x).value;
  const val = +g("elVal");
  if(!val || val < 10000){ toast("Nilai taksasi minimal Rp10.000","warn"); return; }
  l.title = g("elTitle").trim() || l.title;
  l.category = g("elCat"); l.condition = g("elCond");
  l.appraisedValue = val; l.city = g("elCity");
  l.description = g("elDesc").trim();
  l.wants = [{category:g("elWc"), keyword:g("elWk").trim(), min:(l.wants&&l.wants[0]&&l.wants[0].min)||0, max:(l.wants&&l.wants[0]&&l.wants[0].max)||0}];
  if(l.status==="aktif" || l.status==="arsip") l.status = g("elStatus");
  save(); cloudSaveListing(l); closeSheet(); render();
  toast("Barang diperbarui","ok");
}
async function deleteListing(id){
  const l = listing(id);
  if(!l || l.ownerId!==ME){ toast("Hanya pemilik yang dapat menghapus barang ini","warn"); return; }
  const aktif = db.offers.filter(o=>openStatuses.includes(o.status) &&
    (o.targetListingId===id || (o.items||[]).some(i=>i.listingId===id)));
  const pesan = aktif.length
    ? "Barang ini terkait "+aktif.length+" penawaran yang masih berjalan. Menghapusnya akan membatalkan penawaran tersebut. Lanjutkan?"
    : "Hapus barang \""+l.title+"\" secara permanen?";
  if(!window.confirm(pesan)) return;
  aktif.forEach(o=>{
    o.status = "Dibatalkan";
    o.messages.push({id:nid("m"), from:"sys", body:"Penawaran dibatalkan karena barang dihapus pemiliknya", at:Date.now()});
    cloudSaveOffer(o); cloudSaveMessage(o.id, o.messages[o.messages.length-1]);
  });
  db.listings = db.listings.filter(x=>x.id!==id);
  save(); closeSheet(); render(); renderTabs();
  await cloudDeleteListing(id);
  toast("Barang dihapus","ok");
}
async function cloudDeleteListing(id){
  if(!cloudOn() || !isUuid(id)) return;
  try{
    const {error} = await sb.from("barter_listings").delete().eq("id", id);
    if(error) toast("Barang belum terhapus di server: "+error.message,"warn");
  }catch(err){}
}
function archive(id){ const l=listing(id); if(!l) return; l.status="arsip"; save(); render(); cloudSaveListing(l); toast("Listing diarsipkan"); }
function unarchive(id){ const l=listing(id); if(!l) return; l.status="aktif"; save(); render(); cloudSaveListing(l); toast("Listing aktif kembali","ok"); }
function report(id){
  const r = {id:uid("r"), reporterId:ME, targetType:"listing", targetId:id, reason:"Perlu ditinjau moderator", status:"baru"};
  db.reports.push(r);
  save(); cloudSaveReport(r); toast("Laporan dikirim ke moderator BIVAK","warn");
}

let sheetScrollY = 0, lastFocus = null;
function openSheet(title, html){
  const scrim = document.getElementById("scrim");
  const reopen = !scrim.hidden;
  if(!reopen){
    sheetScrollY = window.scrollY || window.pageYOffset || 0;
    lastFocus = document.activeElement;
  }
  document.getElementById("sheetTitle").textContent = title;
  document.getElementById("sheetBody").innerHTML = html;
  scrim.hidden = false;
  /* iOS Safari mengabaikan overflow:hidden pada body, jadi posisinya dipatok. */
  document.body.style.position = "fixed";
  document.body.style.top = (-sheetScrollY) + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.overflow = "hidden";
  scrim.scrollTop = 0;
}
function closeSheet(){
  const scrim = document.getElementById("scrim");
  if(scrim.hidden) return;
  scrim.hidden = true;
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.overflow = "";
  window.scrollTo(0, sheetScrollY);
  state.openOffer = null;
  if(lastFocus && lastFocus.focus){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
  lastFocus = null;
}
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !document.getElementById("scrim").hidden) closeSheet();
});

function togglePick(id, on){
  pick.items = on ? [...new Set([...pick.items, id])] : pick.items.filter(x=>x!==id);
  paintCalc();
}
function paintCalc(){
  const box = document.getElementById("calcBox"); if(!box) return;
  const t = listing(pick.targetId); if(!t) return;
  const give = pick.items.map(x=>listing(x)).filter(Boolean).reduce((a,l)=>a+(Number(l.appraisedValue)||0),0);
  const diff = t.appraisedValue - give;
  const after = diff - pick.cash;
  const c = document.getElementById("cash");
  if(c && !pick.cashTouched){ pick.cash = pick.items.length ? Math.max(0, diff) : 0; c.value = pick.cash; }
  box.innerHTML = `<div class="calc">
    <div class="line"><span>Nilai barangmu (${pick.items.length} barang)</span><b>${rp(give)}</b></div>
    <div class="line"><span>Nilai barang diminta</span><b>${rp(t.appraisedValue)}</b></div>
    <div class="line"><span>Usulan tunai</span><b>${rp(pick.cash)}</b></div>
    <div class="line total"><span>${!pick.items.length?"Pilih barang dulu":Math.abs(after)<1?"Penawaran seimbang":after>0?"Masih kurang":"Kelebihan nilai"}</span><b>${!pick.items.length?"—":Math.abs(after)<1?"✓ adil":rp(Math.abs(after))}</b></div>
  </div>`;
}
function submitOffer(){
  if(!pick.items.length){ toast("Pilih minimal satu barang milikmu","warn"); return; }
  const t = listing(pick.targetId);
  if(!t){ toast("Barang sudah tidak tersedia","warn"); closeSheet(); render(); return; }
  if(t.status!=="aktif"){ toast("Listing sedang dicadangkan","warn"); return; }
  const note = (document.getElementById("note").value||"").trim();
  const proposedItems = pick.items.map(id=>({listingId:id, valueSnapshot:listing(id).appraisedValue}));
  const wanted = itemSetKey(proposedItems);
  const duplicate = db.offers.find(x=>x.proposerId===ME && x.targetListingId===t.id
    && openStatuses.includes(x.status) && itemSetKey(x.items)===wanted);
  if(duplicate){
    closeSheet(); state.box="terkirim"; go("penawaran");
    toast("Barang ini sudah kamu tawarkan untuk listing tersebut · pakai tombol Edit atau pilih barang lain","warn");
    return;
  }
  const o = {
    id:nid("o"), targetListingId:t.id, proposerId:ME,
    items:proposedItems,
    cashAdjustment:pick.cash, note, status:"Diajukan", createdAt:Date.now(),
    messages:[
      {id:nid("m"), from:ME, body: note || "Saya ajukan barter untuk barang ini.", at:Date.now()},
      {id:nid("m"), from:"sys", body:"Penawaran diajukan · menunggu respons pemilik", at:Date.now()}
    ]
  };
  db.offers.unshift(o); save(); closeSheet();
  cloudSaveOffer(o); o.messages.forEach(m=>cloudSaveMessage(o.id, m));
  state.box = "terkirim"; go("penawaran");
  toast("Penawaran terkirim ke "+prof(t.ownerId).name,"ok");
}

        ${acts.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${acts.map(([lab,fn,cls])=>`<button class="btn sm ${cls}" onclick="${fn}">${lab}</button>`).join("")}</div>`
          :`<div class="empty" style="margin-top:14px;padding:18px">Penawaran ini sudah ditutup dengan status <b>${o.status}</b>.</div>`}
      </div>
      <div>
        <h3 class="k">Chat penawaran</h3>
        <div class="thread" id="thread">
          ${o.messages.map(m=>m.from==="sys"
            ? `<div class="msg sys">${esc(m.body)}</div>`
            : `<div class="msg ${m.from===ME?"mine":""}"><span class="who">${esc(prof(m.from).name)} · ${ago(m.at)}</span>${esc(m.body)}</div>`).join("")}
        </div>
        ${closed?`<div class="hint" style="margin-top:12px">Chat ditutup karena penawaran sudah ${o.status.toLowerCase()}.</div>`
        :`<div class="composer">
          <input id="msg" placeholder="Tulis pesan…" onkeydown="if(event.key==='Enter')sendMsg('${id}')">
          <button class="btn primary" onclick="sendMsg('${id}')">Kirim</button>
        </div>
        <div class="hint" style="margin-top:8px">Hanya kamu dan ${esc(other.name)} yang dapat membaca chat ini (RLS).</div>`}
      </div>
    </div>`;
  openSheet("Negosiasi barter", body);
  const th = document.getElementById("thread"); if(th) th.scrollTop = th.scrollHeight;
}
function editOffer(id){
  const o = db.offers.find(x=>x.id===id);
  if(!o || o.proposerId!==ME || !["Diajukan","Negosiasi"].includes(o.status)){
    toast("Penawaran ini tidak dapat diedit","warn"); return;
  }
  const t = listing(o.targetListingId);
  if(!t){ toast("Barang tujuan sudah tidak ada","warn"); return; }
  const body = `<form onsubmit="saveOfferEdit(event,'${id}')" style="display:grid;gap:16px">
    <div class="hint">Ubah nilai tunai atau catatan selama penawaran belum disetujui. Barang yang ditawarkan tetap sama.</div>
    <div class="pickrow" style="cursor:default"><span class="t"><b>${esc(t.title)}</b><span>${o.items.length} barang ditawarkan · ${rp(offerValue(o))}</span></span></div>
    <div class="field"><label for="editCash">Usulan tunai dari kamu (Rp)</label><input id="editCash" type="number" min="0" step="10000" value="${Math.max(0,Number(o.cashAdjustment||0))}" required></div>
    <div class="field"><label for="editNote">Pesan untuk pemilik</label><textarea id="editNote" rows="4" placeholder="Contoh: Bisa bertemu Sabtu pagi?">${esc(o.note||"")}</textarea></div>
    <button class="btn primary" type="submit">Simpan perubahan</button>
  </form>`;
  openSheet("Edit penawaran",body);
}
function saveOfferEdit(event,id){
  event.preventDefault();
  const o = db.offers.find(x=>x.id===id);
  if(!o) return;
  const cash = Math.max(0,Number(document.getElementById("editCash").value||0));
  const note = (document.getElementById("editNote").value||"").trim();
  if(cash===Number(o.cashAdjustment||0) && note===String(o.note||"")){ closeSheet(); return; }
  o.cashAdjustment = cash; o.note = note;
  o.messages.push({id:nid("m"), from:"sys", body:"Penawaran diperbarui oleh penawar", at:Date.now()});
  save(); cloudSaveOffer(o); cloudSaveMessage(o.id,o.messages[o.messages.length-1]);
  toast("Penawaran diperbarui","ok"); openOffer(id);
}
function sendMsg(id){
  const inp = document.getElementById("msg"); if(!inp) return;
  const body = inp.value.trim();
  if(!body) return;
  const o = db.offers.find(x=>x.id===id);
  const target = o ? listing(o.targetListingId) : null;
  if(!o || !target){ toast("Penawaran ini sudah tidak tersedia","warn"); closeSheet(); render(); return; }
  o.messages.push({id:nid("m"), from:ME, body, at:Date.now()});
  if(o.status==="Diajukan") o.status = "Negosiasi";
  save(); openOffer(id);
  cloudSaveMessage(o.id, o.messages[o.messages.length-1]); cloudSaveOffer(o);
  const other = target.ownerId===ME ? o.proposerId : target.ownerId;
  if(!cloudOn()) setTimeout(()=>{
    const cur = db.offers.find(x=>x.id===id);
    if(!cur || ["Ditolak","Dibatalkan","Selesai"].includes(cur.status)) return;
    const replies = ["Siap, saya cek dulu kondisinya ya.","Bisa. Bagaimana kalau bertemu di Karebosi Sabtu pagi?","Kalau selisihnya bisa dibulatkan, saya setuju.","Boleh kirim foto tambahan bagian jahitan?"];
    cur.messages.push({id:uid("m"), from:other, body:replies[Math.floor(Math.random()*replies.length)], at:Date.now()});
    save();
    if(state.openOffer===id) openOffer(id); else toast(prof(other).name+" mengirim pesan baru");
  }, 1400);
}
function setStatus(id, status){
  const o = db.offers.find(x=>x.id===id);
  const t = o ? listing(o.targetListingId) : null;
  if(!o || !t){ closeSheet(); toast("Penawaran ini sudah tidak tersedia","warn"); render(); renderTabs(); return; }
  o.status = status;
  o.messages.push({id:nid("m"), from:"sys", body:"Status penawaran berubah menjadi "+status, at:Date.now()});
  if(status==="Disetujui"){
    t.status = "dicadangkan";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l) l.status="dicadangkan"; });
    toast("Barter disetujui · barang dicadangkan","ok");
  }
  if(status==="Selesai"){
    t.status = "selesai";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l) l.status="selesai"; });
    db.offers.filter(x=>x.targetListingId===t.id && x.id!==o.id && openStatuses.includes(x.status))
      .forEach(x=>{ x.status="Tidak terpilih"; x.messages.push({id:uid("m"),from:"sys",body:"Listing sudah selesai dibarter · penawaran tidak terpilih",at:Date.now()}); });
    db.transactions.push({id:uid("tx"), offerId:o.id, status:"selesai", agreedAt:Date.now(), completedAt:Date.now()});
    cloudSaveTransaction(o.id);
    const me = prof(ME); me.deals += 1; me.reputation = Math.min(5, +(me.reputation + .05).toFixed(2));
    toast("Barter selesai · reputasi diperbarui","ok");
  }
  if(status==="Ditolak"||status==="Dibatalkan"){
    if(t.status==="dicadangkan") t.status="aktif";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l && l.status==="dicadangkan") l.status="aktif"; });
    toast("Penawaran "+status.toLowerCase()+" · listing kembali aktif","warn");
  }
  save(); openOffer(id); renderTabs();
  cloudSaveOffer(o); cloudSaveMessage(o.id, o.messages[o.messages.length-1]);
  cloudSaveListing(t); o.items.forEach(i=>{ const l = listing(i.listingId); if(l) cloudSaveListing(l); });
}

setChrome(false);
initAuth();
</script>
