<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan · BIVAK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F7A5A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-left,0px));
    background:#FBF1DF; color:#1C1C1B;
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .box{
    background:#fff; border:1px solid #E7E1D4; border-radius:16px;
    padding:32px 24px; max-width:460px; width:100%; text-align:center;
    box-shadow:0 18px 44px rgba(0,0,0,.08);
  }
  img{width:72px; height:72px; display:block; margin:0 auto 14px}
  h1{margin:0 0 6px; font-size:clamp(22px,5vw,28px); color:#0C6248}
  p{margin:0 0 20px; color:#5A5A55}
  a{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; padding:0 20px; border-radius:12px;
    background:#0F7A5A; color:#fff; text-decoration:none; font-weight:600;
  }
  a:hover{background:#0C6248}
  a:focus-visible{outline:3px solid #8DC63F; outline-offset:2px}
</style>
</head>
<body>
  <main class="box">
    <img src="favicon.svg" alt="" width="72" height="72">
    <h1>Halaman tidak ditemukan</h1>
    <p>Tautan yang kamu buka sudah dipindahkan atau tidak pernah ada. Barangnya mungkin sudah selesai dibarter.</p>
    <a href="/">Kembali ke beranda BIVAK</a>
  </main>
</body>
</html>
